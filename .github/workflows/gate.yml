name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The platform claim's own legs (docs/harness.md §CI): macOS has no leg — that job was
        # repeatedly starved of a runner, and a job that fails slowly with zero executed steps
        # is infrastructure, not a verdict. The two files are one statement, held together by
        # scripts/tests/test_ci_matrix_claim.py.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The module's own go directive: the workflow and the tree cannot disagree
      # about the Go version the gate builds with. It names ccc/go.mod -- this
      # repository's own module, which the gate's Go steps build and test -- and
      # that module declares the same directive as the carried tree's, so both
      # halves are built with one toolchain. CGO is required by the inherited
      # SQLite driver, so the jobs keep a C compiler installed; the Windows
      # runner is the one disclosed boundary (docs/harness.md).
      - uses: actions/setup-go@v5
        with:
          go-version-file: ccc/go.mod
          cache-dependency-path: ccc/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Built from source so the same command works on every runner without a
      # release download step that can fail on its own. The module path is the
      # one v8.30.1 declares in its own go.mod (github.com/gitleaks/gitleaks is
      # the renamed repository, not the module path), and the version is stamped
      # the way upstream's Makefile does it so `gitleaks version` reports the pin.
      - name: Install gitleaks
        run: go install -ldflags "-X=github.com/zricethezav/gitleaks/v8/version.Version=v8.30.1" github.com/zricethezav/gitleaks/v8@v8.30.1

      # `python`, not `python3`: setup-python puts `python` on PATH on both
      # runners, while the Windows runner has no `python3` name. The
      # file itself is `#!`-tagged python3 and runs either way.
      - name: Gate
        run: python scripts/gate.py
